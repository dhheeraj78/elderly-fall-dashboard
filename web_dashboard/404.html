<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Telemetry Stream Not Found | ElderCare IoT</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="robots" content="noindex, follow">
  <style>
    :root {
      --bg: #F8FAFC;
      --card-bg: #FFFFFF;
      --text-main: #0F172A;
      --text-muted: #64748B;
      --primary: #2563EB;
      --primary-hover: #1D4ED8;
      --border: #E2E8F0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0F172A;
        --card-bg: #1E293B;
        --text-main: #F8FAFC;
        --text-muted: #94A3B8;
        --border: #334155;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, system-ui, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .error-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1.25rem;
      padding: 2.5rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    }
    .badge {
      display: inline-block;
      font-size: 0.8125rem;
      font-weight: 700;
      color: var(--primary);
      background: rgba(37, 99, 235, 0.1);
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      margin-bottom: 1.25rem;
      letter-spacing: 0.05em;
    }
    h1 {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 0.75rem;
      letter-spacing: -0.025em;
    }
    p {
      color: var(--text-muted);
      font-size: 0.9375rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .cta-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background-color: var(--primary);
      color: #FFFFFF;
      font-weight: 600;
      font-size: 0.9375rem;
      text-decoration: none;
      padding: 0.75rem 1.75rem;
      border-radius: 0.75rem;
      transition: background-color 0.15s ease, transform 0.15s ease;
    }
    .cta-btn:hover {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <main class="error-card">
    <span class="badge">HTTP 404 ROUTE NOT FOUND</span>
    <h1>Telemetry Route Inactive</h1>
    <p>The patient monitoring channel or route you requested is unavailable or has been archived under medical privacy compliance.</p>
    <a href="/" class="cta-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      Return to Live Clinical Dashboard
    </a>
  </main>
</body>
</html>
