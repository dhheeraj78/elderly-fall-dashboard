    <text x="704" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="600" fill="#6EE7B7">NIST LWC FINALIST</text>
    <text x="704" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="26" font-weight="700" fill="#10B981">ASCON-128 AEAD</text>
    <text x="704" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="400" fill="#94A3B8">Zero-Tamper Authenticated Cipher</text>
