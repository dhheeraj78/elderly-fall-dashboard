    <text x="24" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="600" fill="#93C5FD">FALL DETECTION ENGINE</text>
    <text x="24" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="26" font-weight="700" fill="#22C55E">93.5% Recall / 2.8% FPR</text>
    <text x="24" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="400" fill="#94A3B8">Stage 1 Shock (2.3g) + 20-Tree RF</text>

    <!-- Pedometer Badge -->
    <rect x="340" y="0" width="300" height="140" rx="16" fill="url(#blueCard)" stroke="#3B82F6" stroke-width="1.5" />
    <text x="364" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="600" fill="#93C5FD">WRIST PEDOMETER ENGINE</text>
    <text x="364" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="26" font-weight="700" fill="#38BDF8">Real-Time Cadence</text>
    <text x="364" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="400" fill="#94A3B8">EMA Baseline + 4-Step Debounce</text>

    <!-- Crypto Badge -->
