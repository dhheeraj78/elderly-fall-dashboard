; PlatformIO Project Configuration File for Seeed Studio XIAO ESP32-S3
; Secure Wearable Health Monitoring System (ASCON-128 + TinyML Random Forest)

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino

; Serial Monitor & Upload Port Configuration
monitor_speed = 115200
upload_port = /dev/cu.usbmodem101
monitor_port = /dev/cu.usbmodem101

; Architecture & Hardware Directives
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi ; 8MB Octal OPI PSRAM

; Build Flags specifically required for Seeed Studio XIAO ESP32-S3
build_flags = 
    -D ARDUINO_USB_CDC_ON_BOOT=1     ; Enables native USB Type-C Serial output
    -D ARDUINO_USB_MODE=1            ; Standard USB CDC mode
    -D BOARD_HAS_PSRAM               ; Enables external 8MB PSRAM
    -D CORE_DEBUG_LEVEL=3            ; Info debug logging level
    -mfix-esp32-psram-cache-issue

; Partition table (default 8MB flash with app + spiffs)
board_build.partitions = default_8MB.csv
